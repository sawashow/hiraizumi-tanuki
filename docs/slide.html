<!doctype html>
<!-- Day8 成果発表の1枚スライド。画像は相対パス（slide_parade.png と ../assets/images/）。このファイルは、リポジトリの中で開くこと。
     キャラクターの行列の絵は、tools/make_slide_parade.py で作る。
     映すときは、ブラウザで開いて F11（全画面）。PDF は Ctrl+P（横向き・余白なし・背景のグラフィックを印刷）。
     文字は、いちばん小さいものでも 28pt（約38px）以上 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平泉タヌキ侍（成果発表）</title>
<style>
  @page { size: 1280px 720px; margin: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root {
    --paper: #fbf7ee;          /* 和紙の白 */
    --ink: #231e19;            /* 墨 */
    --mute: #6b6158;           /* 見出しの、控えめな色 */
    --shu: #c33f26;            /* 朱（強い色は、これだけ。ロゴの赤・鳥居の朱に合わせる） */
    --road: #4a4a52;           /* 道路 */
    --mincho: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    --gothic: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }
  html, body { margin: 0; background: #d8d4cb; }
  body { font-family: var(--gothic); color: var(--ink); }
  .deck { max-width: 1280px; margin: 0 auto; padding: 24px 0; }
  .slide { position: relative; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; overflow: hidden; background: var(--paper); }

  /* 上: 誰の・場面（静かな見出し。下に罫線1本） */
  .head { position: absolute; left: 64px; right: 64px; top: 20px; padding-bottom: 12px; border-bottom: 2px solid #d9cfbf; }
  .row { display: grid; grid-template-columns: 104px 1fr; align-items: baseline; }
  .row + .row { margin-top: 2px; }
  .label { font-family: var(--mincho); font-size: 38px; font-weight: 700; color: var(--mute); margin: 0; }
  .who { font-size: 42px; font-weight: 700; margin: 0; }
  .scene { font-size: 38px; line-height: 1.32; margin: 0; }

  /* 中央: アプリ名（ロゴを、大きく）・ひとこと・交通安全の朱印 */
  .hero { position: absolute; left: 64px; right: 64px; top: 206px; display: flex; align-items: center; gap: 44px; }
  .logo { height: 148px; image-rendering: pixelated; flex: none; margin-left: -6px; }
  .catch { font-family: var(--mincho); font-size: 40px; font-weight: 700; line-height: 1.36; margin: 0; flex: 1; }
  .catch em { font-style: normal; color: var(--shu); }
  .seal {
    flex: none; align-self: flex-start; writing-mode: vertical-rl; margin: 0;
    font-family: var(--mincho); font-size: 50px; font-weight: 800; color: var(--paper); background: var(--shu);
    padding: 12px 8px; letter-spacing: 0.08em; line-height: 1;
  }

  /* 下: 幅いっぱいの道路と横断歩道。その上を、みんなで渡る */
  .road {
    position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: var(--road);
    display: flex; align-items: center; justify-content: flex-end; padding: 0 64px;
  }
  .road::before {   /* 横断歩道の白線（名前の手前まで） */
    content: ""; position: absolute; left: 40px; width: 860px; top: 12px; bottom: 12px;   /* 白線の幅＋間（52）の倍数から、最後の間を引いた幅 */
    background: repeating-linear-gradient(90deg, #f3f0e6 0 28px, transparent 28px 52px);
  }
  .parade { position: absolute; left: 64px; bottom: 70px; width: 1152px; height: 232px; image-rendering: pixelated; }
  .by { position: relative; margin: 0; font-size: 38px; color: #fff; letter-spacing: 0.06em; }

  @media print {
    html, body { background: var(--paper); }
    .deck { padding: 0; max-width: none; }
    .slide { width: 1280px; height: 720px; }
  }
</style>
</head>
<body>
<div class="deck">
  <section class="slide">
    <div class="head">
      <div class="row">
        <p class="label">誰の</p>
        <p class="who">平泉を歩いて回る、歴史が苦手な人</p>
      </div>
      <div class="row">
        <p class="label">場面</p>
        <p class="scene">中尊寺の月見坂で、藤原四代の話を聞いたのに、<br>名前も順番も、まったく頭に入らなかった</p>
      </div>
    </div>

    <div class="hero">
      <img class="logo" src="../assets/images/title_logo.png" alt="平泉タヌキ侍">
      <p class="catch">遊んでいるうちに、<br>平泉の<em>名所</em>と<em>藤原四代</em>が、<br>順番どおりに覚えられるゲーム</p>
      <p class="seal">交通安全</p>
    </div>

    <div class="road"><p class="by">澤田 昌平</p></div>
    <img class="parade" src="slide_parade.png" alt="藤原四代のボスと敵たち、姫、先頭のタヌキ侍が、横断歩道を渡る">
  </section>
</div>
</body>
</html>
