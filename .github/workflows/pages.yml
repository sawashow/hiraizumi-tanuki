# ブラウザ版を GitHub 側で作り、そのまま GitHub Pages に公開する。
# main へ push したとき、ゲームの中身が変わっていれば動く。手でも動かせる。
name: build-web

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "assets/images/**"
      - "assets/audio/**"
      - "tools/build_web.py"
      - "tools/web_template.tmpl"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04   # latest は 2026-10-19 に別の版へ移るため、固定する
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pygbag==0.9.3
      - run: python tools/build_web.py
      - name: pygbag でビルド
        env:
          PYTHONUTF8: "1"
        run: python -m pygbag --build --PYBUILD 3.12 --template tools/web_template.tmpl web
      - name: 公開用のファイルを集める
        run: |
          mkdir _site
          cp web/build/web/index.html web/build/web/web.tar.gz _site/
          # 後読みの曲（config.BGM_LATE）。本体には入れず、起動のあとに取りに行く。一覧は config.py を読む（書き忘れを防ぐ）。1曲でも欠けたら失敗にする
          for f in $(python -c "import config; print(' '.join(config.BGM_LATE))"); do
            cp "assets/audio/$f" _site/
          done
          cp assets/images/favicon.png _site/     # タヌキ侍の顔（tools/make_favicon.py で作る）
          cp docs/CNAME _site/
          touch _site/.nojekyll
          # 本体の読み込みに、版の番号を付ける（公開直後に、ブラウザが古い本体を使わないように）。置き換わらなければ、失敗にする
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/index.html
          grep -c "tar.gz?v=${GITHUB_SHA::8}" _site/index.html
          ls -l _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # itch.io にも、同じ版を上げる（itch.io の遊ぶ場所は、web.tar.gz ではなく web.apk を読むため、詰め替えた zip を作る）。
      # 以降の手順は、失敗しても本番（GitHub Pages）の公開を止めない。API キー（Secrets の BUTLER_API_KEY）が無ければ、飛ばす
      - name: itch.io 用の zip を作る
        continue-on-error: true
        run: python tools/make_itch_zip.py _site itch.zip
      - name: itch.io へ上げる（butler）
        continue-on-error: true
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "BUTLER_API_KEY が未登録のため、itch.io への送信は飛ばす"; exit 0; fi
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler push itch.zip ponpocoworks/hiraizumi-tanuki:html5 --userversion "${GITHUB_SHA::8}"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
